name: 问题反馈
description: 报告可复现问题，请勿附带凭据或数据库
body:
  - type: input
    id: version
    attributes:
      label: 大肥鱼版本、Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎样复现，预期是什么，实际发生了什么
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 管家模式
      options: [直连管家, Harness 管家, 演示, 不确定]
  - type: textarea
    id: error
    attributes:
      label: 错误文字与执行器版本（可选）
      description: 删除密钥、令牌、用户名和私人内容；不要上传整个数据目录。
