name: 功能建议
description: 描述你想解决的具体问题和使用场景
body:
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到了什么问题？
      description: 可以举一个日常使用的例子。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望大肥鱼怎样帮你？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前怎样处理？（可选）
