name: Build Windows preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.14)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: preview-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            desktop/backend-lite.package-lock.json
      - name: Validate tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") { throw 'Version tag mismatch' }
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Install Electron runtime
        working-directory: desktop
        run: node node_modules/electron/install.js
      - run: npm run check:repository
      - run: npm run check
      - run: npm --prefix desktop run check
      - run: npm --prefix desktop run build
      - name: Build and verify both editions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $out=New-Item -ItemType Directory -Path public-release
          $hashes=@()
          $editions=@()
          foreach ($profile in @('lite','full')) {
            & npm --prefix desktop run package:prepare -- "--profile=$profile"
            if ($LASTEXITCODE -ne 0) { throw "Prepare failed: $profile" }
            & node desktop/scripts/check-packaged-backend.mjs
            if ($LASTEXITCODE -ne 0) { throw "Backend tool verification failed: $profile" }
            Push-Location desktop
            & node node_modules/electron-builder/cli.js --config electron-builder.json "--config.directories.output=release/$profile" --win --dir --publish never
            $buildExit=$LASTEXITCODE
            Pop-Location
            if ($buildExit -ne 0) { throw "Package failed: $profile" }
            $app=(Resolve-Path "desktop/release/$profile/win-unpacked").Path
            & node desktop/scripts/verify-packaged-app.mjs $app "work/packaged-$profile-verify"
            if ($LASTEXITCODE -ne 0) { throw "Native application verification failed: $profile" }
            $edition=if ($profile -eq 'lite') {'Lite'} else {'Full'}
            $archive=Join-Path $out.FullName "Dafeiyu-$version-$edition-windows-x64.zip"
            @"
          大肥鱼管家 $version · $edition · Windows x64 预览版
          完整解压后运行“大肥鱼管家.exe”。Lite 默认推荐，支持直连模型、工具、任务与事务；Full 另外包含 Harness。
          两版自带后端和 Node.js，不包含本项目未使用的 Office 转换二进制。真实聊天需个人 API Key，编码需已登录的执行器。
          数据在 %APPDATA%/dayu-desktop-pet/。切换版本前等任务结束并退出旧版，数据继续保留；Lite 不会自动把已有 Harness 配置改成直连。
          未签名，不是安装器。遇到系统拦截请检查来源与提示，不要关闭安全保护。
          代码与原创文档采用 MIT，素材许可见包内 CREDITS。不要上传凭据或个人数据。
          https://github.com/SatakaGintoki/dafeiyu-assistant
          "@ | Set-Content (Join-Path $app 'README-WINDOWS.txt') -Encoding utf8
            & 7z a -tzip -mx=1 -bso0 -bsp0 $archive "$app/*"
            if ($LASTEXITCODE -ne 0) { throw "Archive failed: $profile" }
            & 7z t -bso0 -bsp0 $archive
            if ($LASTEXITCODE -ne 0) { throw "Archive validation failed: $profile" }
            $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes+="$hash  $(Split-Path $archive -Leaf)"
            $unpacked=(Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum
            $editions+=@{edition=$edition;file=(Split-Path $archive -Leaf);bytes=(Get-Item $archive).Length;unpackedBytes=$unpacked;sha256=$hash;nativeVerified=$true;backendToolsVerifiedWithMockModel=$true}
          }
          $hashes | Set-Content (Join-Path $out.FullName 'SHA256SUMS.txt') -Encoding utf8
          @{version=$version;commit=(git rev-parse HEAD);editions=$editions;signed=$false;builtBy='GitHub Actions Windows';runId=$env:GITHUB_RUN_ID} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out.FullName "release-$version.json") -Encoding utf8
      - name: Upload and publish prerelease
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const tag = process.env.RELEASE_TAG;
            const version = tag.slice(1);
            const body = `Windows x64 早期预览版，提供两个版本：\n\n- **Lite（推荐）**：直连 DeepSeek，保留管家工具、编码任务与续做、项目记忆、日程提醒、流式对话、Markdown 和桌宠表情。\n- **Full**：包含以上功能和官方 Harness SDK。\n\n完整解压后运行“大肥鱼管家.exe”。两版共用个人数据，切换前等任务结束并退出旧版；已有 Harness 配置在 Lite 中会明确提示，不静默切换模型运行方式。\n\n裁掉调试映射和管家未使用的 Office 可选二进制，保留许可证。大小与 SHA256 见 release-${version}.json 和 SHA256SUMS.txt。两版均在干净 Windows 环境验证原生启动、置顶与演示流程；Direct/Harness 后端工具循环使用模拟模型验证，不代表真实账号或所有执行器通过。\n\n**未签名的 ZIP，不是安装器或稳定版。** 真实使用需个人凭据，数据在 %APPDATA%/dayu-desktop-pet/。代码 MIT，素材来源和许可单独保留。`;
            const existing = (await github.rest.repos.listReleases({...context.repo, per_page:100})).data.find(r=>r.tag_name===tag);
            if(existing && !existing.draft) throw new Error('Release already public; refusing to replace assets');
            const release = existing || (await github.rest.repos.createRelease({...context.repo,tag_name:tag,name:`大肥鱼管家 ${tag} · Lite / Full`,body,draft:true,prerelease:true})).data;
            const assets = (await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            for(const file of fs.readdirSync('public-release')) {
              const data=fs.readFileSync(path.join('public-release',file));
              const digest='sha256:'+crypto.createHash('sha256').update(data).digest('hex');
              let asset=assets.find(a=>a.name===file);
              if(!asset) asset=(await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:file,data,headers:{'content-type':'application/octet-stream','content-length':data.length}})).data;
              if(asset.size!==data.length || asset.digest!==digest) throw new Error('Asset verification failed: '+file);
            }
            await github.rest.repos.updateRelease({...context.repo,release_id:release.id,body,draft:false,prerelease:true});
            core.info(release.html_url);
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-failure
          path: |
            work/packaged-*-verify/
          retention-days: 7
          if-no-files-found: ignore
