name: Windows verification
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Install Electron runtime
        working-directory: desktop
        run: node node_modules/electron/install.js
      - run: npm run check:repository
      - run: npm run check
      - run: npm --prefix desktop run check
      - run: npm run docs
      - run: git diff --exit-code -- docs/openapi.json
      - run: npm --prefix desktop run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-desktop-test
          path: work/desktop-smoke-*/
          retention-days: 7
          if-no-files-found: ignore
